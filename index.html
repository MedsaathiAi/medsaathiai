function formatMsg(text, accent) {
  return text.split("\n").map((line, i) => {
    if (!line.trim()) return React.createElement('div', {key:i, style:{height:6}});
    if (line.startsWith("⚠️ Ye jankari") || line.startsWith("💡 Ye") || line.startsWith("⚠️ DISCLAIMER")) return React.createElement('div', {key:i, style:{background:"linear-gradient(135deg,#fff8e1,#fff3cd)",border:"1px solid #f0a500",borderLeft:"4px solid #e67e00",borderRadius:8,padding:"10px 14px",marginTop:12,fontSize:13,color:"#7a4500",fontWeight:500,lineHeight:1.6}}, line);
    if (line.includes("🚨 TURANT") || (line.startsWith("🚨") && line.length > 4)) return React.createElement('div', {key:i, style:{background:"#fff0f0",border:"1px solid #fc8181",borderLeft:"4px solid #c53030",borderRadius:8,padding:"10px 14px",marginTop:8,fontSize:13,color:"#742a2a",fontWeight:700,lineHeight:1.6}}, line);
    if (line.includes("Doctor ki salah se in mein se ek le sakte hain")) return React.createElement('div', {key:i, style:{background:"#e8f5ee",border:"1px solid #a8d5bf",borderLeft:"3px solid #0a6640",borderRadius:8,padding:"8px 12px",marginTop:4,fontSize:12,color:"#0a4428",fontStyle:"italic"}}, line);
    if (/^\*\*[^*]+\*\*$/.test(line.trim())) return React.createElement('div', {key:i, style:{fontWeight:700,color:accent,marginTop:14,fontSize:14,borderBottom:`1px solid ${accent}33`,paddingBottom:4}}, line.replace(/\*\*/g,""));
    if (/\*\*/.test(line)) {
      const parts = line.split(/\*\*(.+?)\*\*/g);
      return React.createElement('div', {key:i, style:{marginTop:4,lineHeight:1.7,fontSize:14,color:"#2d3748"}}, parts.map((p,j) => j%2===1 ? React.createElement('strong', {key:j, style:{color:accent}}, p) : p));
    }
    if (/^(1st|2nd|3rd|4th) Choice:/.test(line.trim())) return React.createElement('div', {key:i, style:{display:"flex",gap:8,marginTop:5,fontSize:14,color:"#2d3748",paddingLeft:8}}, React.createElement('span', {style:{color:accent,fontWeight:700,flexShrink:0,minWidth:80}}, line.split(":")[0]+":"), React.createElement('span', {style:{lineHeight:1.6}}, line.split(":").slice(1).join(":").trim()));
    if (/^[-•]/.test(line.trim())) return React.createElement('div', {key:i, style:{display:"flex",gap:8,marginTop:4,fontSize:14,color:"#2d3748",lineHeight:1.6}}, React.createElement('span', {style:{color:accent,flexShrink:0}}, "•"), React.createElement('span', null, line.trim().slice(1).trim()));
    if (/^\d+\./.test(line.trim())) return React.createElement('div', {key:i, style:{marginTop:4,fontSize:14,color:"#2d3748",lineHeight:1.6,paddingLeft:4}}, line);
    return React.createElement('div', {key:i, style:{fontSize:14,color:"#2d3748",lineHeight:1.7,marginTop:3}}, line);
  });
}

function ChatPane({feature, profileCtx=""}) {
  const [msgs, setMsgs] = React.useState([{role:"assistant",content:`Namaste! ${feature.icon}\n\nKya poochna chahte ho? Main yahan hoon! 😊`}]);
  const [input, setInput] = React.useState("");
  const [loading, setLoading] = React.useState(false);
  const [imgPreview, setImgPreview] = React.useState(null);
  const [imgBase64, setImgBase64] = React.useState(null);
  const bottomRef = React.useRef(null);
  const fileRef = React.useRef(null);
  const isFirst = React.useRef(true);

  React.useEffect(() => { bottomRef.current && bottomRef.current.scrollIntoView({behavior:"smooth"}); }, [msgs, loading]);

  const handleImg = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => { setImgBase64(e.target.result.split(",")[1]); setImgPreview(e.target.result); };
    reader.readAsDataURL(file);
  };

  const send = async (txt) => {
    const text = txt || input.trim();
    if ((!text && !imgBase64) || loading) return;
    setInput(""); setLoading(true);
    const userDisplay = text || "📸 Photo bheji hai";
    const newMsgs = [...msgs, {role:"user", content:userDisplay, imgPreview}];
    setMsgs(newMsgs);
    setImgPreview(null);

    let userContent = [];
    if (imgBase64) userContent.push({type:"image", source:{type:"base64", media_type:"image/jpeg", data:imgBase64}});
    const textToSend = (profileCtx && isFirst.current) ? profileCtx + "\n\nUser query: " + (text || "Is photo ko dekh ke batao.") : (text || "Is photo ko medical perspective se explain karo.");
    userContent.push({type:"text", text: textToSend});
    if (isFirst.current) isFirst.current = false;
    setImgBase64(null);

    try {
      const histMsgs = msgs.filter(m => !m.imgPreview).map(m => ({role:m.role, content:m.content}));
      const res = await fetch("/api/chat", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({model:"claude-3-5-haiku-latest", max_tokens:1600, system:feature.prompt, messages:[...histMsgs, {role:"user", content:userContent}]})
      });
      const data = await res.json();
      const reply = JSON.stringify(data);
      setMsgs(prev => [...prev, {role:"assistant", content:reply}]);
    } catch(e) {
      setMsgs(prev => [...prev, {role:"assistant", content:"⚠️ Network error. Please try again."}]);
    } finally { setLoading(false); }
  };

  const accent = feature.color;
  return React.createElement('div', {style:{display:"flex",flexDirection:"column",flex:1,minHeight:0}},
    React.createElement('div', {style:{flex:1,overflowY:"auto",padding:16,display:"flex",flexDirection:"column",gap:14}},
      msgs.length === 1 && feature.suggestions && React.createElement('div', {style:{padding:"20px 0"}},
        React.createElement('p', {style:{textAlign:"center",fontSize:13,color:"#6b9e87",marginBottom:12}}, "💡 Kuch pooch sakte ho:"),
        React.createElement('div', {style:{display:"flex",flexWrap:"wrap",gap:8,justifyContent:"center"}},
          feature.suggestions.map((s,i) => React.createElement('button', {key:i, onClick:()=>send(s), style:{background:"white",border:"1.5px solid #c8e6d4",borderRadius:20,padding:"7px 14px",fontSize:12,color:accent,cursor:"pointer"}}, s))
        )
      ),
      msgs.map((msg, i) => React.createElement('div', {key:i, style:{display:"flex",flexDirection:msg.role==="user"?"row-reverse":"row",gap:10,alignItems:"flex-start"}},
        React.createElement('div', {style:{width:34,height:34,borderRadius:"50%",flexShrink:0,background:msg.role==="user"?`linear-gradient(135deg,${accent},#0a3322)`:"linear-gradient(135deg,#f0f0f0,#fff)",border:msg.role==="assistant"?"2px solid #c8e6d4":"none",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}, msg.role==="user"?"👤":"🤖"),
        React.createElement('div', {style:{maxWidth:"80%",background:msg.role==="user"?`linear-gradient(135deg,#0a5535,${accent})`:"white",color:msg.role==="user"?"white":"#2d3748",borderRadius:msg.role==="user"?"18px 4px 18px 18px":"4px 18px 18px 18px",padding:"12px 16px",boxShadow:"0 2px 14px rgba(0,0,0,0.08)",fontSize:14,lineHeight:1.6,border:msg.role==="assistant"?"1px solid #d4eddf":"none"}},
          msg.imgPreview && React.createElement('img', {src:msg.imgPreview, style:{width:"100%",maxWidth:180,borderRadius:8,marginBottom:8,display:"block"}}),
          msg.role==="assistant" ? formatMsg(msg.content, accent) : msg.content
        )
      )),
      loading && React.createElement('div', {style:{display:"flex",gap:10,alignItems:"flex-start"}},
        React.createElement('div', {style:{width:34,height:34,borderRadius:"50%",background:"linear-gradient(135deg,#f0f0f0,#fff)",border:"2px solid #c8e6d4",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}, "🤖"),
        React.createElement('div', {style:{background:"white",borderRadius:"4px 18px 18px 18px",padding:"14px 18px",border:"1px solid #d4eddf",display:"flex",gap:6,alignItems:"center"}},
          [0,1,2].map(j => React.createElement('div', {key:j, style:{width:8,height:8,borderRadius:"50%",background:accent,animation:`bounce 1.2s ease-in-out ${j*0.2}s infinite`}}))
        )
      ),
      React.createElement('div', {ref:bottomRef})
    ),
    imgPreview && React.createElement('div', {style:{padding:"8px 16px",background:"#f0f8ff",borderTop:"1px solid #c8e6d4",display:"flex",alignItems:"center",gap:10}},
      React.createElement('img', {src:imgPreview, style:{width:48,height:48,objectFit:"cover",borderRadius:8}}),
      React.createElement('span', {style:{fontSize:13,color:accent,flex:1,fontWeight:600}}, "📸 Photo ready — Send karo"),
      React.createElement('button', {onClick:()=>{setImgPreview(null);setImgBase64(null);}, style:{background:"#e53e3e",border:"none",borderRadius:6,color:"white",padding:"4px 8px",cursor:"pointer",fontSize:12}}, "✕")
    ),
    React.createElement('div', {style:{borderTop:"1px solid #c8e6d4",padding:"12px 16px",background:"rgba(240,250,245,0.97)"}},
      (feature.showImg || feature.isReport) && React.createElement('div', {style:{marginBottom:8,display:"flex",alignItems:"center",gap:8}},
        React.createElement('button', {onClick:()=>fileRef.current&&fileRef.current.click(), style:{background:`linear-gradient(135deg,${accent},#0a3322)`,border:"none",borderRadius:10,color:"white",padding:"7px 14px",fontSize:12,cursor:"pointer",display:"flex",alignItems:"center",gap:6,fontWeight:600}}, "📸 Photo Upload karo"),
        React.createElement('input', {ref:fileRef, type:"file", accept:"image/*", style:{display:"none"}, onChange:e=>handleImg(e.target.files[0])}),
        React.createElement('span', {style:{fontSize:11,color:"#7a9e8a"}}, feature.isReport ? "Report/USG photo upload karo" : "Medicine strip, wound, rash — koi bhi")
      ),
      React.createElement('div', {style:{display:"flex",gap:10,alignItems:"flex-end"}},
        React.createElement('textarea', {value:input, onChange:e=>setInput(e.target.value),
          onKeyDown:e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}},
          onInput:e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,120)+"px";},
          placeholder:feature.placeholder, rows:1,
          style:{flex:1,border:"2px solid #c8e6d4",borderRadius:14,padding:"11px 14px",fontSize:14,resize:"none",background:"white",color:"#2d3748",outline:"none",minHeight:44,maxHeight:120,lineHeight:1.5,boxSizing:"border-box"},
          onFocus:e=>e.target.style.borderColor=accent, onBlur:e=>e.target.style.borderColor="#c8e6d4"
        }),
        React.createElement('button', {onClick:()=>send(), disabled:loading||(!input.trim()&&!imgBase64),
          style:{width:44,height:44,background:loading||(!input.trim()&&!imgBase64)?"#c8e6d4":`linear-gradient(135deg,${accent},#0a3322)`,border:"none",borderRadius:12,color:"white",fontSize:20,cursor:loading||(!input.trim()&&!imgBase64)?"not-allowed":"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}
        }, loading?"⏳":"➤")
      ),
      React.createElement('p', {style:{textAlign:"center",color:"#9ab8ac",fontSize:11,marginTop:7,fontStyle:"italic"}}, "⚕️ Emergency: 112 | Ye app doctor ki jagah nahi le sakta")
    )
  );
}

function App() {
  const [screen, setScreen] = React.useState("home");
  const [activeF, setActiveF] = React.useState(null);
  const [profile, setProfile] = React.useState({age:"",gender:"Male",weight:"",history:"None",currentMeds:"None",allergies:"None",pregnant:"No"});
  const [profileSaved, setProfileSaved] = React.useState(false);
  const [errors, setErrors] = React.useState({});
  const [openEmerg, setOpenEmerg] = React.useState(null);
  const [tipIdx] = React.useState(() => Math.floor(Math.random()*HEALTH_TIPS.length));

  const profileCtx = profileSaved ? `PATIENT PROFILE:\n- Age: ${profile.age} years\n- Gender: ${profile.gender}\n- Weight: ${profile.weight||"Not provided"} kg\n- Medical History: ${profile.history}\n- Current Medications: ${profile.currentMeds}\n- Allergy History: ${profile.allergies}\n- Pregnancy Status: ${profile.pregnant}\n\nPersonalise all advice. Check drug interactions and allergies.` : "";

  const openFeature = (f) => {
    if (f.isEmergency) { setActiveF(f); setScreen("feature"); return; }
    if (!profileSaved && f.id === "ask") { setActiveF(f); setScreen("profile"); return; }
    setActiveF(f); setScreen("feature");
  };

  const validate = () => { const e={}; if(!profile.age||isNaN(profile.age)||+profile.age<1) e.age="Valid age daalo"; setErrors(e); return Object.keys(e).length===0; };
  const saveProfile = () => { if(!validate()) return; setProfileSaved(true); setScreen("feature"); };

  const e = React.createElement;

  if (screen === "home") return e('div', {style:{minHeight:"100vh",background:"linear-gradient(160deg,#f0faf5,#e8f5ee)"}},
    e('div', {style:{background:"linear-gradient(135deg,#0a5535,#12a865)",boxShadow:"0 4px 24px rgba(10,85,53,0.4)"}},
      e('div', {style:{maxWidth:840,margin:"0 auto",padding:"16px 20px",display:"flex",alignItems:"center",justifyContent:"space-between"}},
        e('div', {style:{display:"flex",alignItems:"center",gap:12}},
          e('div', {style:{width:46,height:46,background:"rgba(255,255,255,0.15)",borderRadius:14,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,border:"1.5px solid rgba(255,255,255,0.25)"}}, "🏥"),
          e('div', null, e('div', {style:{color:"white",fontSize:22,fontWeight:700}}, "MedSaathiAI"), e('div', {style:{color:"rgba(255,255,255,0.7)",fontSize:11,fontStyle:"italic"}}, "Aapka Swasthya Saathi • आपका स्वास्थ्य साथी"))
        ),
        e('div', {style:{display:"flex",alignItems:"center",gap:6}},
          e('div', {style:{width:8,height:8,background:"#4ade80",borderRadius:"50%",animation:"pulse 2s infinite"}}),
          e('span', {style:{color:"rgba(255,255,255,0.8)",fontSize:12}}, "Online")
        )
      ),
      e('div', {style:{maxWidth:840,margin:"0 auto",padding:"16px 20px 34px",textAlign:"center"}},
        e('div', {style:{fontSize:50,marginBottom:10}}, "🩺"),
        e('h1', {style:{color:"white",fontSize:22,fontWeight:700,marginBottom:8}}, "Aapka AI Health Companion"),
        e('p', {style:{color:"rgba(255,255,255,0.82)",fontSize:13,lineHeight:1.8}}, "Symptoms se diet tak, medicines se reports tak — sab ek jagah. Hindi mein. 🇮🇳")
      )
    ),
    e('div', {style:{maxWidth:840,margin:"-20px auto 0",padding:"0 16px 30px"}},
      e('div', {style:{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:12,marginBottom:14}},
        FEATURES.map(f => e('button', {key:f.id, onClick:()=>openFeature(f), style:{background:"white",border:"1.5px solid #d4eddf",borderRadius:18,padding:"18px 16px",textAlign:"left",cursor:"pointer",boxShadow:"0 2px 14px rgba(0,0,0,0.06)",transition:"all 0.2s"},
          onMouseEnter:ev=>{ev.currentTarget.style.transform="translateY(-2px)";ev.currentTarget.style.borderColor=f.color;},
          onMouseLeave:ev=>{ev.currentTarget.style.transform="translateY(0)";ev.currentTarget.style.borderColor="#d4eddf";}},
          e('div', {style:{fontSize:28,marginBottom:8}}, f.icon),
          e('div', {style:{fontSize:13,fontWeight:700,color:f.color,marginBottom:3}}, f.title),
          e('div', {style:{fontSize:11,color:"#7a9e8a",lineHeight:1.5}}, f.desc)
        ))
      ),
      e('div', {style:{background:"white",border:"1px solid #d4eddf",borderLeft:"4px solid #12a865",borderRadius:14,padding:"14px 16px",marginBottom:12}},
        e('div', {style:{fontSize:11,color:"#7a9e8a",marginBottom:5,fontWeight:600}}, "💡 AAJ KA HEALTH TIP"),
        e('div', {style:{fontSize:14,color:"#2d3748",lineHeight:1.7}}, HEALTH_TIPS[tipIdx])
      ),
      e('button', {onClick:()=>openFeature(FEATURES.find(f=>f.isEmergency)), style:{width:"100%",background:"linear-gradient(135deg,#7a1515,#c0392b)",border:"none",borderRadius:14,padding:"14px",color:"white",fontSize:14,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:10,boxShadow:"0 4px 16px rgba(192,57,43,0.3)"}},
        "🚨 Emergency First Aid Guide — Turant Kya Karein 🚨"
      ),
      profileSaved && e('div', {style:{marginTop:12,background:"#e8f5ee",border:"1px solid #a8d5bf",borderRadius:12,padding:"10px 14px",display:"flex",alignItems:"center",gap:10,fontSize:13}},
        e('span', null, "✅"),
        e('span', {style:{color:"#0a5535",fontWeight:600}}, `Profile: ${profile.age}y ${profile.gender} • ${profile.history}`),
        e('button', {onClick:()=>{setProfileSaved(false);setProfile({age:"",gender:"Male",weight:"",history:"None",currentMeds:"None",allergies:"None",pregnant:"No"});}, style:{marginLeft:"auto",background:"none",border:"1px solid #0a6640",borderRadius:8,color:"#0a6640",padding:"3px 8px",cursor:"pointer",fontSize:11}}, "Update")
      ),
      e('p', {style:{textAlign:"center",color:"#9ab8ac",fontSize:11,marginTop:14,lineHeight:1.7}}, "⚕️ Emergency: 112 | Bina doctor ki salah medicine li aur nuksan hua to MedSaathiAI zimmedar nahi hoga")
    )
  );

  if (screen === "profile") return e('div', {style:{minHeight:"100vh",background:"linear-gradient(160deg,#f0faf5,#e8f5ee)"}},
    e('div', {style:{background:"linear-gradient(135deg,#0a5535,#12a865)",padding:"14px 20px",display:"flex",alignItems:"center",gap:12,position:"sticky",top:0,zIndex:10}},
      e('button', {onClick:()=>setScreen("home"), style:{background:"rgba(255,255,255,0.15)",border:"none",borderRadius:8,color:"white",width:36,height:36,cursor:"pointer",fontSize:18}}, "←"),
      e('div', {style:{color:"white",fontWeight:700,fontSize:16}}, "📋 Patient Profile")
    ),
    e('div', {style:{maxWidth:600,margin:"0 auto",padding:"20px 16px 40px"}},
      e('div', {style:{textAlign:"center",marginBottom:20}},
        e('div', {style:{fontSize:38,marginBottom:8}}, "🩺"),
        e('h2', {style:{color:"#0a5535",fontSize:18,fontWeight:700,marginBottom:6}}, "Pehle thodi details do"),
        e('p', {style:{color:"#4a7c6a",fontSize:13}}, "Taaki safe aur personalized advice mil sake")
      ),
      e('div', {style:{display:"flex",flexDirection:"column",gap:13}},
        ...[
          {key:"age",label:"Umar (Age)",placeholder:"e.g. 35",type:"text",icon:"🎂",req:true},
          {key:"gender",label:"Gender",type:"select",icon:"👤",opts:["Male","Female","Other"]},
          {key:"weight",label:"Weight (kg)",placeholder:"e.g. 70",type:"text",icon:"⚖️"},
          {key:"history",label:"Bimari ki History",placeholder:"Diabetes, BP... ya None",type:"text",icon:"📋"},
          {key:"currentMeds",label:"Current Medicines",placeholder:"Jo abhi le rahe ho... ya None",type:"text",icon:"💊"},
          {key:"allergies",label:"Allergy History",placeholder:"Penicillin... ya None",type:"text",icon:"🤧"},
          {key:"pregnant",label:"Pregnant/Breastfeeding?",type:"select",icon:"🤰",opts:["No","Pregnant","Breastfeeding","N/A (Male)"]},
        ].map(f => e('div', {key:f.key},
          e('label', {style:{display:"flex",alignItems:"center",gap:6,fontSize:13,fontWeight:600,color:"#0a5535",marginBottom:5}},
            f.icon, " ", f.label, f.req && e('span', {style:{color:"#e53e3e",fontSize:11}}, "*")
          ),
          f.type==="select"
            ? e('select', {value:profile[f.key], onChange:ev=>setProfile(p=>({...p,[f.key]:ev.target.value})), style:{width:"100%",border:`2px solid ${errors[f.key]?"#e53e3e":"#c8e6d4"}`,borderRadius:10,padding:"10px 12px",fontSize:14,background:"white",color:"#2d3748",outline:"none"}},
                f.opts.map(o => e('option', {key:o}, o))
              )
            : e('input', {value:profile[f.key], onChange:ev=>setProfile(p=>({...p,[f.key]:ev.target.value})), placeholder:f.placeholder, style:{width:"100%",border:`2px solid ${errors[f.key]?"#e53e3e":"#c8e6d4"}`,borderRadius:10,padding:"10px 12px",fontSize:14,background:"white",color:"#2d3748",outline:"none"}}),
          errors[f.key] && e('div', {style:{color:"#e53e3e",fontSize:12,marginTop:3}}, "⚠️ ", errors[f.key])
        )),
        e('button', {onClick:saveProfile, style:{background:"linear-gradient(135deg,#12a865,#0a5535)",color:"white",border:"none",borderRadius:12,padding:"14px",fontSize:15,fontWeight:700,cursor:"pointer",marginTop:6}}, "✅ Profile Save Karo — Shuru Karein"),
        e('p', {style:{textAlign:"center",color:"#9ab8ac",fontSize:11,fontStyle:"italic"}}, "🔒 Info sirf is session mein • Kuch bhi save nahi hota")
      )
    )
  );

  if (screen === "feature" && activeF && activeF.isEmergency) return e('div', {style:{minHeight:"100vh",background:"#fff8f8"}},
    e('div', {style:{background:"linear-gradient(135deg,#7a1515,#c0392b)",padding:"14px 20px",display:"flex",alignItems:"center",gap:12,position:"sticky",top:0,zIndex:10}},
      e('button', {onClick:()=>setScreen("home"), style:{background:"rgba(255,255,255,0.15)",border:"none",borderRadius:8,color:"white",width:36,height:36,cursor:"pointer",fontSize:18}}, "←"),
      e('div', {style:{color:"white",fontWeight:700,fontSize:16}}, "🚨 Emergency First Aid Guide")
    ),
    e('div', {style:{maxWidth:840,margin:"0 auto",padding:16}},
      e('div', {style:{background:"#ffe8e8",border:"2px solid #fc8181",borderRadius:12,padding:"12px 16px",marginBottom:14,textAlign:"center",fontSize:14,color:"#742a2a",fontWeight:700}}, "🚨 Kisi bhi emergency mein PEHLE 112 call karein!"),
      e('div', {style:{display:"flex",flexDirection:"column",gap:10}},
        EMERGENCY_DATA.map((tip, i) => e('div', {key:i, style:{background:"white",border:"1.5px solid #fca5a5",borderRadius:14,overflow:"hidden"}},
          e('button', {onClick:()=>setOpenEmerg(openEmerg===i?null:i), style:{width:"100%",padding:"14px 18px",background:"none",border:"none",textAlign:"left",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between"}},
            e('span', {style:{fontSize:15,fontWeight:700,color:"#7a1515"}}, tip.title),
            e('span', {style:{fontSize:14,color:"#7a1515"}}, openEmerg===i?"▲":"▼")
          ),
          openEmerg===i && e('div', {style:{padding:"0 18px 18px",display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}},
            e('div', null,
              e('div', {style:{fontSize:11,fontWeight:700,color:"#7a1515",marginBottom:8}}, "⚠️ PEHCHANO"),
              tip.signs.map((s,j) => e('div', {key:j, style:{fontSize:13,color:"#2d3748",padding:"4px 0",borderBottom:"1px solid #fff0f0",display:"flex",gap:6}}, e('span', {style:{color:"#c0392b"}}, "•"), s))
            ),
            e('div', null,
              e('div', {style:{fontSize:11,fontWeight:700,color:"#0a5535",marginBottom:8}}, "✅ TURANT KARO"),
              tip.action.map((a,j) => e('div', {key:j, style:{fontSize:13,color:"#2d3748",padding:"4px 0",borderBottom:"1px solid #f0fff8",display:"flex",gap:6}}, e('span', {style:{color:"#0a6640",fontWeight:700}}, `${j+1}.`), a))
            )
          )
        ))
      ),
      e('div', {style:{marginTop:14,background:"#fff0f0",border:"1px solid #fca5a5",borderRadius:12,padding:"12px 16px",textAlign:"center",fontSize:13,color:"#742a2a"}},
        "📞 ", e('strong', null, "112"), " (All) • ", e('strong', null, "102"), " (Ambulance) • ", e('strong', null, "108"), " (Medical)"
      )
    )
  );

  if (screen === "feature" && activeF) return e('div', {style:{height:"100vh",display:"flex",flexDirection:"column",background:"linear-gradient(160deg,#f0faf5,#e8f5ee)"}},
    e('div', {style:{background:activeF.grad,padding:"12px 18px",display:"flex",alignItems:"center",gap:12,flexShrink:0,boxShadow:"0 2px 16px rgba(0,0,0,0.2)"}},
      e('button', {onClick:()=>setScreen("home"), style:{background:"rgba(255,255,255,0.15)",border:"none",borderRadius:8,color:"white",width:34,height:34,cursor:"pointer",fontSize:18}}, "←"),
      e('span', {style:{fontSize:22}}, activeF.icon),
      e('div', null,
        e('div', {style:{color:"white",fontWeight:700,fontSize:15}}, activeF.title),
        e('div', {style:{color:"rgba(255,255,255,0.75)",fontSize:11}}, activeF.sub)
      ),
      activeF.id==="ask" && profileSaved && e('div', {style:{marginLeft:"auto",background:"rgba(255,255,255,0.18)",borderRadius:10,padding:"4px 10px",fontSize:11,color:"white"}}, `👤 ${profile.age}y ${profile.gender}`)
    ),
    e(ChatPane, {key:activeF.id, feature:activeF, profileCtx: activeF.id==="ask"?profileCtx:""})
  );

  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
