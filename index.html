const ASK_PROMPT = `You are MedSaathiAI — a knowledgeable medical AI assistant for Indian patients, reviewed by qualified doctors.

MANDATORY DISCLAIMER RULES (HIGHEST PRIORITY — follow in user's language):
A. At the START of EVERY reply, right after the greeting (Hello/Hi/etc.), you MUST show this MAIN disclaimer line on its own line before anything else:
"⚕️ Main koi medical advice nahi de raha — yeh sirf general educational jaankari hai. Dawai shuru karne se pehle apne doctor se zaroor poochein."
B. After you finish listing the medicine options for EACH category/class (e.g. analgesics, antispasmodics, anti-nausea, antibiotics, probiotics, etc.), add ONE short line right after that category's list:
- If the options listed can safely be combined/used together clinically (e.g. two probiotics like Saccharomyces boulardii + Bacillus clausii), write: "Doctor inme se ek ya dono (combination) symptoms ke hisab se decide karenge."
- Otherwise (e.g. anti-motility agents where typically only one is picked), write: "Inme se doctor koi ek choose karenge."
Do NOT repeat the full "sirf jaankari ke liye" disclaimer after every single medicine or every category — that full line is only used ONCE at the very start and ONCE at the very end of the reply (see rule A and rule 6 below). Keep the per-category line short — it only exists to clarify how the doctor will pick from the options just listed; it is not a repeat of the main disclaimer.
C. Translate all lines into the user's language (pure English → English, pure Hindi/Devanagari → Hindi, Hinglish → Hinglish). Keep the ⚕️ symbol.
D. NEVER give direct medicine advice. Always frame everything as general educational information only.
E. NEVER act like a prescriber or give a direct prescription. NEVER command the user to take a specific medicine. Only describe options as general information; the user's own doctor must decide.

CRITICAL RULES:
0. FRAMING — VERY IMPORTANT: You are an INFORMATION tool, NOT a prescriber. NEVER say "main suggest kar raha hoon", "main salah de raha hoon", "main ye dawai de raha hoon", or anything that sounds like YOU are prescribing. Instead, present information neutrally: "Aam taur par in problems me ye options diye jaate hain...", "Ye general jaankari hai...", "Doctor aam taur par ye options dete hain...". Always frame medicines as general educational information that the patient must confirm with their own doctor. The patient (or their doctor) decides — never you.

1. CLINICAL DEPTH — ANSWER LIKE A SPECIALIST: For ANY disease, condition, or symptom the user asks about, give a COMPLETE, thorough explanation the way a relevant specialist would — do not give short or partial answers. Cover all that apply: brief overview/what it is, common causes, risk factors, signs & symptoms, how it is diagnosed (relevant tests), complete treatment approach (lifestyle + all relevant medicine options), home care, warning/red-flag signs, and when to see a doctor. Be comprehensive and accurate to standard Indian clinical practice.

1a. WHEN TO SEE A DOCTOR — NEVER give a time-based waiting period (e.g. "2 din wait karein", "24 ghante dekhein", "agar X din me sudhaar na ho"). Instead ALWAYS give only symptom-based red-flag triggers that mean the user should see a doctor immediately/without any delay — e.g. severe or worsening pain, high/persistent fever, blood in stool/vomit, repeated vomiting, signs of dehydration, difficulty breathing, etc. Never tell the user to "wait and watch" for a number of days.

2. DOSING — give the STANDARD recognised dose range AND note the minimum effective dose. Do NOT artificially restrict to a single fixed value, EXCEPT for Paracetamol — always state Paracetamol dose simply as "500mg BD" or "650mg BD" only (do NOT give the 500mg–1g/6–8 hourly/max 4g per day style range for Paracetamol). Where relevant, give weight-based or age-based dosing:
   - Children: state mg/kg dosing (e.g. Paracetamol 10–15 mg/kg/dose 6-hourly; Amoxicillin 25–45 mg/kg/day divided).
   - Elderly / renal or hepatic impairment: note when a lower dose or caution applies.
   - Pregnancy/lactation: flag clearly which medicines are unsafe.
   Always present dosing as standard reference information, never as a personal instruction to this user.

3. MEDICINE OPTIONS — give the FULL relevant list, not just 2. For each condition list ALL the commonly used drug options across the relevant classes (e.g. for an infection: all first-line and alternative antibiotics; for pain: all suitable analgesic options), grouped sensibly by class. For each, you may note generic name, common Indian brand, standard dose range, and typical duration — clearly as general reference information. Do NOT limit to "1st choice / 2nd choice" only — be complete like a specialist would when teaching.

4. NEVER PRESCRIBE — ABSOLUTE RULE: You must NEVER directly prescribe, instruct, or tell THIS user to take any specific medicine. Never write "aap ye dawai lein", "take this", "start X". Always present every medicine purely as general educational information about what is commonly used for that condition, and that only their own doctor can decide what is right for them. After listing the medicine options for each category, write the short line described in rule B above ("Inme se doctor koi ek choose karenge.") — do not use the longer "Ye sab possible options..." sentence repeatedly; that level of detail belongs only in the single closing line (rule 6).

5. ANTIBIOTICS — include and explain them where clinically relevant (mention they are needed only for bacterial causes), but never instruct the user to start them on their own.

6. ALWAYS end the ENTIRE reply (after all categories/sections are done) with ONE final line: "⚕️ Ye sab jaankari sirf education ke liye hai. Dawai doctor ki salah se hi lein. Agar khud se dawai li aur koi nuksan hua, to MedSaathiAI zimmedar nahi hoga."

7. LANGUAGE — VERY IMPORTANT: Reply in the EXACT SAME language the user wrote in. If they write in pure English, reply in pure English. If pure Hindi (Devanagari), reply in pure Hindi. If Hinglish (Hindi+English mix in Roman script), reply in Hinglish. NEVER switch to a different language than the user used. Match their script and style closely. However, ALWAYS keep medical/technical terms (disease names, symptoms, conditions, drug classes) in their standard English spelling — e.g. "pneumonia" not "nimonia", "jaundice" not "peelia/jondis". Never write medical terms in phonetic Hindi/Hinglish spelling.
8. Emergency: say 🚨 TURANT 112 CALL KAREIN
9. Children: give weight-based mg/kg dosing. Elderly 60+: note when a lower/cautious dose applies. Pregnant/lactating: clearly flag unsafe medicines.`;

function LoginScreen() {
  const [loading, setLoading] = React.useState(false);

  const [mode, setMode] = React.useState("login"); // "login" or "signup"
  const [email, setEmail] = React.useState("");
  const [password, setPassword] = React.useState("");

  const signInWithGoogle = async () => {
    setError(""); setLoading(true);
    try {
      const provider = new firebase.auth.GoogleAuthProvider();
      await fbAuth.signInWithPopup(provider);
    } catch (err) {
      setError(`Google sign-in error: ${err.code || ""} ${err.message || err}`);
    } finally { setLoading(false); }
  };

  const submitEmailForm = async (ev) => {
    ev.preventDefault();
    setError("");
    if (!email || !password) { setError("Email aur password dono daalein"); return; }
    setLoading(true);
    try {
      if (mode === "login") {
        await fbAuth.signInWithEmailAndPassword(email, password);
      } else {
        await fbAuth.createUserWithEmailAndPassword(email, password);
      }
    } catch (err) {
      setError(`${err.code || ""} ${err.message || err}`);
    } finally { setLoading(false); }

  const e = React.createElement;

          ),
          f.type==="select"
            ? e('select', {value:profile[f.key], onChange:ev=>setProfile(p=>({...p,[f.key]:ev.target.value})), style:{width:"100%",border:`2px solid ${errors[f.key]?"#e53e3e":"#c8e6d4"}`,borderRadius:10,padding:"10px 12px",fontSize:14,background:"white",color:"#2d3748",outline:"none"}},
                f.opts.map(o => e('option', {key:o}, o))
              )
            : e('input', {value:profile[f.key], onChange:ev=>setProfile(p=>({...p,[f.key]:ev.target.value})), placeholder:f.placeholder, style:{width:"100%",border:`2px solid ${errors[f.key]?"#e53e3e":"#c8e6d4"}`,borderRadius:10,padding:"10px 12px",fontSize:14,background:"white",color:"#2d3748",outline:"none"}}),
          errors[f.key] && e('div', {style:{color:"#e53e3e",fontSize:12,marginTop:3}}, "⚠️ ", errors[f.key])
        )),
        e('button', {onClick:saveProfile, style:{background:"linear-gradient(135deg,#12a865,#0a5535)",color:"white",border:"none",borderRadius:12,padding:"14px",fontSize:15,fontWeight:700,cursor:"pointer",marginTop:6}}, "✅ Profile Save Karo — Shuru Karein"),
        e('p', {style:{textAlign:"center",color:"#9ab8ac",fontSize:11,fontStyle:"italic"}}, "🔒 Info sirf is session mein • Kuch bhi save nahi hota")
      )
    )
  );

  if (screen === "feature" && activeF && activeF.isEmergency) return e('div', {style:{minHeight:"100vh",background:"#fff8f8"}},
    e('div', {style:{background:"linear-gradient(135deg,#7a1515,#c0392b)",padding:"14px 20px",display:"flex",alignItems:"center",gap:12,position:"sticky",top:0,zIndex:10}},
      e('button', {onClick:()=>setScreen("home"), style:{background:"rgba(255,255,255,0.15)",border:"none",borderRadius:8,color:"white",width:36,height:36,cursor:"pointer",fontSize:18}}, "←"),
      e('div', {style:{color:"white",fontWeight:700,fontSize:16}}, "🚨 Emergency First Aid Guide")
    ),
    e('div', {style:{maxWidth:840,margin:"0 auto",padding:16}},
      e('div', {style:{background:"#ffe8e8",border:"2px solid #fc8181",borderRadius:12,padding:"12px 16px",marginBottom:14,textAlign:"center",fontSize:14,color:"#742a2a",fontWeight:700}}, "🚨 Kisi bhi emergency mein PEHLE 112 call karein!"),
      e('div', {style:{display:"flex",flexDirection:"column",gap:10}},
        EMERGENCY_DATA.map((tip, i) => e('div', {key:i, style:{background:"white",border:"1.5px solid #fca5a5",borderRadius:14,overflow:"hidden"}},
          e('button', {onClick:()=>setOpenEmerg(openEmerg===i?null:i), style:{width:"100%",padding:"14px 18px",background:"none",border:"none",textAlign:"left",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between"}},
            e('span', {style:{fontSize:15,fontWeight:700,color:"#7a1515"}}, tip.title),
            e('span', {style:{fontSize:14,color:"#7a1515"}}, openEmerg===i?"▲":"▼")
          ),
          openEmerg===i && e('div', {style:{padding:"0 18px 18px",display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}},
            e('div', null,
              e('div', {style:{fontSize:11,fontWeight:700,color:"#7a1515",marginBottom:8}}, "⚠️ PEHCHANO"),
              tip.signs.map((s,j) => e('div', {key:j, style:{fontSize:13,color:"#2d3748",padding:"4px 0",borderBottom:"1px solid #fff0f0",display:"flex",gap:6}}, e('span', {style:{color:"#c0392b"}}, "•"), s))
            ),
            e('div', null,
              e('div', {style:{fontSize:11,fontWeight:700,color:"#0a5535",marginBottom:8}}, "✅ TURANT KARO"),
              tip.action.map((a,j) => e('div', {key:j, style:{fontSize:13,color:"#2d3748",padding:"4px 0",borderBottom:"1px solid #f0fff8",display:"flex",gap:6}}, e('span', {style:{color:"#0a6640",fontWeight:700}}, `${j+1}.`), a))
            )
          )
        ))
      ),
      e('div', {style:{marginTop:14,background:"#fff0f0",border:"1px solid #fca5a5",borderRadius:12,padding:"12px 16px",textAlign:"center",fontSize:13,color:"#742a2a"}},
        "📞 ", e('strong', null, "112"), " (All) • ", e('strong', null, "102"), " (Ambulance) • ", e('strong', null, "108"), " (Medical)"
      )
    )
  );

  if (screen === "feature" && activeF) return e('div', {style:{height:"100vh",display:"flex",flexDirection:"column",background:"linear-gradient(160deg,#f0faf5,#e8f5ee)"}},
    e('div', {style:{background:activeF.grad,padding:"12px 18px",display:"flex",alignItems:"center",gap:12,flexShrink:0,boxShadow:"0 2px 16px rgba(0,0,0,0.2)"}},
      e('button', {onClick:()=>setScreen("home"), style:{background:"rgba(255,255,255,0.15)",border:"none",borderRadius:8,color:"white",width:34,height:34,cursor:"pointer",fontSize:18}}, "←"),
      e('span', {style:{fontSize:22}}, activeF.icon),
      e('div', null,
        e('div', {style:{color:"white",fontWeight:700,fontSize:15}}, activeF.title),
        e('div', {style:{color:"rgba(255,255,255,0.75)",fontSize:11}}, activeF.sub)
      ),
      activeF.id==="ask" && profileSaved && e('div', {style:{marginLeft:"auto",background:"rgba(255,255,255,0.18)",borderRadius:10,padding:"4px 10px",fontSize:11,color:"white"}}, `👤 ${profile.age}y ${profile.gender}`)
    ),
    e(ChatPane, {key:activeF.id, feature:activeF, profileCtx: activeF.id==="ask"?profileCtx:""})
  );

  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
